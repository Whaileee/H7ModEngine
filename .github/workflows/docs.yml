name: Docs

# Publishes the documentation site (docs/ + mkdocs.yml) to GitHub Pages.
# The site is always built from the docs on a release tag:
#   - automatically when a release is published (prereleases are skipped),
#   - manually with "Run workflow" for a given tag (default: the latest release), e.g. to rebuild after a fix to
#     this workflow.
# Pull requests that touch the docs only build the site (strict), so broken links fail before a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the docs from (empty = latest release)
        required: false
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - tools/docs/**
      - .github/workflows/docs.yml

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Choose the tag to build from
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            release) ref="$RELEASE_TAG" ;;
            workflow_dispatch)
              ref="$INPUT_TAG"
              if [ -z "$ref" ]; then
                ref=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName) || {
                  echo "::error::No release found; publish a release or pass a tag"; exit 1; }
              fi ;;
            *) ref="" ;;  # pull request: build the PR's own docs
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building docs from: ${ref:-$GITHUB_REF}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref && format('refs/tags/{0}', steps.ref.outputs.ref) || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r tools/docs/requirements.txt

      - name: Build site
        env:
          H7_DOCS_REF: ${{ steps.ref.outputs.ref }}
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
