; H7ModEngine configuration

[Mods]
; Mods turned on or off in the in-game Mods menu (comma-separated names). They override each mod's own
; "enabled" setting, e.g. Enabled=DailyGold or Disabled=HelloWorld
Enabled=
Disabled=

[Dev]
; Write names.txt / objects.txt (an index of every engine object) to dumps\ at startup
DumpSDK=1
; Engine development only: write raw layout snapshots used for engine calibration
DumpProbe=0
; Engine development only: write the unpacked game executable for static analysis (~100 MB)
DumpImage=0
